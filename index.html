<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>信 · Letters 支持</title>
  <style>
    body{margin:0;background:#fbf5e8;color:#332d27;font:17px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{max-width:720px;margin:auto;padding:64px 24px}h1{font-size:38px;margin:0 0 8px}h2{margin-top:40px}a{color:#8c2e29}
    .card{background:#f4ead6;border-radius:18px;padding:24px;margin-top:28px}.muted{color:#756a60}
  </style>
</head>
<body><main>
  <h1>信 · Letters</h1>
  <p class="muted">慢下来的书写与聆听。</p>
  <div class="card">
    <h2>使用帮助</h2>
    <p><strong>写信：</strong>点按“写信”，输入内容、选择印记和署名，再装入打字机。</p>
    <p><strong>封信：</strong>为当前信件设置口令，生成加密信卡并保存或分享。</p>
    <p><strong>拆信：</strong>从相册选择朋友发来的信卡，输入双方约定的口令。</p>
    <p><strong>管理：</strong>在“信屉”中重温、切换或删除本机信件。</p>
  </div>
  <h2>联系我们</h2>
  <p>如遇到问题，请在 <a href="https://github.com/isdou/letters-support/issues">GitHub Issues</a> 中提交反馈。</p>
  <p><a href="privacy.html">隐私政策</a></p>
</main></body>
</html>
